      x-operation-id-source: derived
  /v1/account/{account}/contract/{method}:
    get:
      summary: Get latest action args for contract method
      tags:
      - Legacy / Account
      parameters:
      - in: path
        name: account
        required: true
        description: Account ID
        schema:
          type: string
        examples:
          account:
            value: example-account-id
      - in: path
        name: method
        required: true
        description: Method name
        schema:
          type: string
        examples:
          method:
