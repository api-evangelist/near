openapi: 3.2.0
info:
  description: NearBlocks REST API for the NEAR Protocol block explorer. Provides endpoints to access blockchain data including accounts, transactions, blocks, tokens, NFTs, and staking.
  title: NearBlocks Explorer Legacy / Access Keys API
  version: 1.0.0
servers:
- description: Mainnet
  url: https://api.nearblocks.io
- description: Testnet
  url: https://api-testnet.nearblocks.io
tags:
- description: Deprecated.
  name: Legacy / Access Keys
paths:
  /v1/keys/{key}:
    get:
      summary: Get access key info by public key
      tags:
      - Legacy / Access Keys
      parameters:
      - in: path
        name: key
        required: true
        description: Public key
        schema:
          type: string
        examples:
          key:
            value: example-public-key
      responses:
        '200':
          description: Success response
      operationId: getV1KeysByKey
      x-operation-id-source: derived
components:
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
