openapi: 3.2.0
info:
  description: NearBlocks REST API for the NEAR Protocol block explorer. Provides endpoints to access blockchain data including accounts, transactions, blocks, tokens, NFTs, and staking.
  title: NearBlocks Explorer Legacy / Stats API
  version: 1.0.0
servers:
- description: Mainnet
  url: https://api.nearblocks.io
- description: Testnet
  url: https://api-testnet.nearblocks.io
tags:
- description: Deprecated.
  name: Legacy / Stats
paths:
  /v1/stats:
    get:
      summary: Get stats
      tags:
      - Legacy / Stats
      responses:
        '200':
          description: Success response
      operationId: getV1Stats
      x-operation-id-source: derived
  /v1/stats/price:
    get:
      summary: Get near price
      tags:
      - Legacy / Stats
      parameters:
      - in: query
        name: date
        description: Date in YYYY-MM-DD format
        schema:
          type: string
      responses:
        '200':
          description: Success response
      operationId: getV1StatsPrice
      x-operation-id-source: derived
components:
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
